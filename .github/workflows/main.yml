name: build WF
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '10 2 * * 1-5' # Schedule the workflow to run at 2:10 AM every weekday (Monday to Friday)       
    
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
    
      - name: Build Maven
        run: mvn install   

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vapp
          path: target/*.war

      - name: Notify Slack
        if: failure()
        run: echo "Build failed! Notifying Slack..." # Replace with actual Slack notification command

  Test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Tests on main branch
        run: mvn test

      - name: Checkstyle Report
        run: mvn checkstyle:checkstyle