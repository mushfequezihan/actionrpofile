name: build WF
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '10 2 * * 1-5' # Schedule the workflow to run at 2:10 AM every weekday (Monday to Friday)       
    
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
    
      - name: Build Maven
        run: mvn install   

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vapp-${{ github.run_id }}
          path: target/*.war

      - name: Notify Slack
        if: failure()
        run: echo "Build failed! Notifying Slack..." # Replace with actual Slack notification command

  Test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle Report
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: not run tests on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Tests are only run on the main branch. Skipping tests for this branch."

  Security-Scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run trivy scan on main branch
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: .
          format: 'json'
          exit-code: '0'
          vuln-type: 'os,library'
          output: 'trivy-report.json'
          
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: trivy-report.json